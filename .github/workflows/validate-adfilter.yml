name: Validate supplemental TV ad filter
on:
  workflow_dispatch:
  push:
    branches: [ad2]
    paths:
      - "adfilter/**"
      - ".github/workflows/validate-adfilter.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ad2
          sparse-checkout: adfilter
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check adfilter/safe_addon.js
      - run: node adfilter/test_addon.js
